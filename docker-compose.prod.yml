version: '3.8'

services:
  # 1. PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: cvl_prod_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgrespassword}
      POSTGRES_DB: ${POSTGRES_DB:-cloud_virtual_lab}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-cloud_virtual_lab}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - cvl_network

  # 2. Redis Distributed Cache & Session Store
  redis:
    image: redis:7-alpine
    container_name: cvl_prod_redis
    restart: always
    command: >
      sh -c 'if [ -n "$REDIS_PASSWORD" ]; then
        redis-server --requirepass "$REDIS_PASSWORD" --appendonly yes;
      else
        redis-server --appendonly yes;
      fi'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a ${REDIS_PASSWORD:-} ping || redis-cli ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - cvl_network

  # 3. Node.js & Express API Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cvl_prod_backend
    restart: always
    environment:
      NODE_ENV: production
      PORT: 5000
      CLIENT_URL: ${CLIENT_URL:-http://localhost}
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgrespassword}@postgres:5432/${POSTGRES_DB:-cloud_virtual_lab}?schema=public
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-1d}
      COOKIE_SAME_SITE: ${COOKIE_SAME_SITE:-lax}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      STORAGE_ENCRYPTION_SECRET: ${STORAGE_ENCRYPTION_SECRET}
      STORAGE_DRIVER: ${STORAGE_DRIVER:-local}
      STORAGE_UPLOAD_PATH: /app/storage/uploads
      S3_BUCKET: ${S3_BUCKET:-}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-false}
      MAX_FILE_SIZE_MB: ${MAX_FILE_SIZE_MB:-25}
      DEFAULT_USER_QUOTA_MB: ${DEFAULT_USER_QUOTA_MB:-100}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@virtuallab.edu}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-AdminSecurePassword123!}
      REDIS_ENABLED: ${REDIS_ENABLED:-true}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      REDIS_REQUIRED: ${REDIS_REQUIRED:-true}
    volumes:
      # Persistent Encrypted Storage Volume
      - encrypted_storage:/app/storage/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:5000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - cvl_network

  # 4. React SPA Frontend & Nginx Gateway
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: cvl_prod_frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - cvl_network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  encrypted_storage:
    driver: local

networks:
  cvl_network:
    driver: bridge
