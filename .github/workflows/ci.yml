name: Continuous Integration & Verification

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================================
  # 1. Backend Testing & TypeScript Compilation
  # ============================================================================
  backend-test-and-build:
    name: Backend CI (Tests & Build)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: cloud_virtual_lab_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      PORT: 5000
      CLIENT_URL: http://localhost:5173
      DATABASE_URL: postgresql://postgres:postgrespassword@localhost:5432/cloud_virtual_lab_test?schema=public
      JWT_SECRET: ci_test_jwt_secret_min_32_characters_long_for_security_testing
      JWT_EXPIRES_IN: 1d
      STORAGE_ENCRYPTION_SECRET: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      STORAGE_DRIVER: local
      STORAGE_UPLOAD_PATH: ./storage/uploads
      MAX_FILE_SIZE_MB: 25
      DEFAULT_USER_QUOTA_MB: 100
      ADMIN_EMAIL: admin@virtuallab.edu
      ADMIN_PASSWORD: AdminSecurePassword123!

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20.x LTS
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'backend/package-lock.json'

      - name: Create Temporary Test Upload Directory
        run: mkdir -p backend/storage/uploads storage/uploads

      - name: Install Backend Dependencies
        working-directory: ./backend
        run: npm ci

      - name: Generate Prisma Client
        working-directory: ./backend
        run: npx prisma generate

      - name: Apply Database Migrations
        working-directory: ./backend
        run: npx prisma migrate deploy

      - name: Seed Initial Test Database Records
        working-directory: ./backend
        run: npx prisma db seed

      - name: Run Backend Automated Test Suite (127 Tests)
        working-directory: ./backend
        run: npm test

      - name: Compile Backend TypeScript
        working-directory: ./backend
        run: npm run build

  # ============================================================================
  # 2. Frontend Production Bundle Compilation
  # ============================================================================
  frontend-build:
    name: Frontend CI (Bundle & TypeScript)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20.x LTS
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Build & Verify Production Bundle
        working-directory: ./frontend
        run: npm run build

  # ============================================================================
  # 3. Docker Production Image Verification
  # ============================================================================
  docker-build-verification:
    name: Docker Image Build Verification
    needs: [backend-test-and-build, frontend-build]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          tags: cvl-backend:ci

      - name: Build Frontend Nginx Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          tags: cvl-frontend:ci
